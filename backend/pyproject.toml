[build-system]
requires = ["setuptools>=68", "Cython>=3.0"]
build-backend = "setuptools.build_meta"

[project]
name = "conclave-backend"
version = "0.1.0"
description = "Conclave 会议型多智能体系统后端（迭代一）"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.5",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "openai>=1.0",
    "qdrant-client>=1.7",
    "websockets>=12.0",
    "playwright>=1.40",
    "beautifulsoup4>=4.12",
    "psycopg2-binary>=2.9",
    "psutil>=5.9",
    "jieba>=0.42",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "redis[hiredis]>=5.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-xdist>=3.5",
    "pytest-timeout>=2.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "conclave_core*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
# pytest-xdist worker 数不在此处配置（历史教训：addopts 里的 -n auto 在
# 多核机器上开满逻辑核——20 worker 同时 import 全量应用栈，内存峰值触发
# OOM killer，全体 worker "crashed/node down"；且 addopts 被追加到命令行
# 末尾，命令行 `-n X` 无法覆盖 addopts 的 `-n`，xdist 取最后一个）。
# worker 数由各运行入口显式指定：
#   - docker-compose.test.yml backend-test command: -n 4（CI 与本地全量）
#   - scripts/docker-ci-check.sh（pre-push）: -n0 单进程
#   - 裸跑 pytest 默认串行，需并行请显式加 -n 4
# --timeout=30: 单测超时 30s
# --timeout-method=thread: 线程超时（兼容 asyncio）
# 如需禁用多进程（调试单测）：pytest -p no:xdist
addopts = "--timeout=30 --timeout-method=thread"

[tool.ruff]
target-version = "py310"
line-length = 120
extend-exclude = ["scripts", "eval_v2"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "S"]
ignore = [
    "E501",   # line too long (由格式化处理)
    "B008",   # Do not perform function call in argument defaults (FastAPI Depends 需要)
    "RUF001", # ambiguous-unicode-character-string (中文字符误报)
    "RUF002", # ambiguous-unicode-character-docstring
    "RUF003", # ambiguous-unicode-character-comment
    "RUF009", # Do not perform function call in dataclass defaults (config.py 的 _env() 模式是故意的)
    # S 规则初始宽松配置，后续逐步收紧
    "S101",   # assert 使用 — 测试代码中 assert 是合法的
    "S104",   # hardcoded-bind-all-interfaces — Docker 容器绑定 0.0.0.0 是有意设计
    "S105",   # hardcoded-password-string — 默认管理员密码检测是有意逻辑，后续改用安全比较
    "S108",   # hardcoded-temp-file — 已知 1 处，后续修复
    "S110",   # try-except-pass — Conclave 中存在有意的异常吞没，后续逐一审查
    "S311",   # Standard pseudo-random generators — 非安全场景 random 是合法的
    "S324",   # hashlib-insecure-hash-function — MD5 用于非安全场景(缓存键等)，后续审查
    "S608",   # hardcoded-sql-expression — 44处 f-string SQL，部分安全(内部常量)部分需修复，后续逐一审查
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
# 渐进式严格模式：先放宽现有代码，后续逐步收紧
check_untyped_defs = false
disallow_untyped_defs = false
no_implicit_optional = false
