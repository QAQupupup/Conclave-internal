# UI 设计系统 Skill
# 封装用户的审美偏好和前端设计规则
# 来源：《个人签单风格与逻辑规范 v1.0》+ 历次前端Bug修复经验沉淀

id: ui_design_system
name: "UI设计系统"
description: "用户的审美偏好、色彩体系、排版规则和前端反模式清单。生成任何前端代码（HTML/CSS/React组件）时必须遵守。"
version: 2
type: style
priority: 90
tags: ["design", "frontend", "css", "aesthetic"]

applies_to:
  stages: ["produce"]
  deliverable_types: ["deployable_service", "design_doc"]
  roles: ["engineer", "ux_designer"]
  complexity: []  # 所有复杂度

prompt: |
  # 设计系统规范（必须严格遵守）

  ## 核心设计哲学
  - **反装饰，功能优先**：不为装饰而装饰，每个视觉元素必须服务于信息传达
  - **克制色彩，纯色为王**：大面积留白+单一品牌色点缀，禁止多彩渐变、彩虹色
  - **信息密度优先**：在可读性前提下尽量提高信息密度，避免不必要的padding/margin浪费
  - **场景分层，各司其职**：不同层级信息用不同灰度区分，不依赖颜色区分层级

  ## 色彩体系
  - 背景：纯白 `#ffffff` 为主，次级 `#fafafa`，三级 `#f4f6f8`，悬浮 `#f4f6f8`
  - 品牌色：**沉稳靛蓝 `#335c8e`**（唯一主色调，用于按钮、链接、选中态、强调）
  - 品牌色悬浮态：`#264670`；浅色背景：`rgba(51,92,142,0.06)`
  - 文字：主文字 `#111827`（冷灰非纯黑），次级 `#6b7280`，辅助 `#9ca3af`
  - 边框：常规 `#e5e7eb`，柔和 `#f3f4f6`，强调 `#d1d5db`
  - 状态色：成功 `#2d8a56`、警告 `#b87d2b`、错误 `#c53030`、信息 `#335c8e`
  - 状态色背景：6%透明度（如 `rgba(45,138,86,0.06)`）
  - **糖果色标记**（仅用于小面积点缀）：角色标识可用低饱和糖果色（#8B8FC8、#B07FD1、#E8A5C4、#7DB8A8 等），但面积不超过5%

  ## 排版规则
  - 字体：-apple-system, "Segoe UI", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif
  - Inter/Roboto 仅用于纯英文数字场景（数据表格数字列、代码行号），中文正文不得使用 Inter/Roboto 作为首选字体
  - 等宽字体："JetBrains Mono", "SF Mono", "Cascadia Code", Consolas, monospace
  - 字号层级：标题16-18px semibold、正文13-14px、辅助11-12px、代码12px
  - 行高：正文1.5-1.6，标题1.3
  - 字重：常规400、中等500、半粗600、粗体700（不要用900/black）

  ## 形状与间距
  - 圆角：小元素4px、卡片6-8px、按钮6px、胶囊999px（全圆角仅用于badge/pill）
  - 阴影：**极轻阴影**，透明度0.04-0.06，禁止重阴影和发光效果
    - xs: `0 1px 2px rgba(0,0,0,0.04)`
    - sm: `0 1px 3px rgba(0,0,0,0.06)`
    - focus: `0 0 0 2px rgba(51,92,142,0.15)`
  - 间距基准：4px为单位（4/8/12/16/20/24/32/40/48/64px）
  - 过渡：时长与缓动必须取自「动效规格」的 token（--duration-* / --ease-*），仅用于颜色/透明度/transform，**禁止动画布局属性**（width/height/top/left）

  ## 布局与组件规范
  - 表格：Notion风格，柔和表头（`#fafafa`背景）、浅灰行线（`#f3f4f6`）、扁平无阴影
  - 按钮：主按钮靛蓝底白字、次按钮白底灰边框、文字按钮无底色
  - Badge/Tag：inline-flex、左右padding 6px、圆角3px、字号11px、font-weight 600、line-height 1.6、max-width 200px截断
  - 卡片：1px `#e5e7eb`边框、8px圆角、白色背景、无阴影（hover时才加sm阴影）
  - 输入框：1px `#d1d5db`边框、6px圆角、focus时边框变`#335c8e`+focus ring

  ## 前端CSS反模式（必须避免）
  1. **文字溢出**：所有可能溢出的文本容器必须设置溢出保护：
     - 单行截断：`overflow: hidden; text-overflow: ellipsis; white-space: nowrap`
     - 多行文本：`word-break: break-word; overflow-wrap: anywhere`
     - flex子项必须设 `min-width: 0`（否则flex item不会收缩导致溢出）
     - 固定宽度文字标签设 `flex-shrink: 0` 防止被压缩
  2. **Flex布局陷阱**：
     - flex容器的子项需要收缩时，必须给子项设 `min-width: 0` 或 `min-height: 0`
     - 不要让长文本撑破flex容器：给文本容器 `flex: 1; min-width: 0`
     - 代码块/pre标签：必须 `overflow-x: auto` + `max-width: 100%`
  3. **z-index管理**：modal=1000、dropdown=100、tooltip=200、toast=300，禁止使用9999
  4. **禁止**：大面积渐变、3D效果、重阴影、动画布局属性、text-shadow、!important
  5. **图表设计**：
     - 数据点不超过12个（超过则采样）
     - 线条宽度1.5px，不用蓝色用柔和深灰蓝
     - 数据点标签仅显示端点或关键节点
     - Y轴自动计算间隔避免重复标签
     - canvas渲染优先，禁用入场动画
  6. **Modal/面板**：
     - 标题必须flex+截断，防止长标题挤压关闭按钮
     - body必须 `overflow-x: hidden`
     - 内容区设 `min-width: 0` 防止子元素撑开
  7. **列表/会议列表**：最新内容在最上方（倒序，DESC by created_at），不要reverse
  8. **中英文混排**：中文与英文/数字之间加半角空格（如"创建于 3 天前"）

  ## 交互设计
  - Hover反馈必须即时（`--duration-hover` 120ms 过渡）
  - 点击区域不小于32x32px（按钮最小尺寸）
  - 加载状态使用skeleton或spinner，不要空白
  - 错误状态要有明确的错误信息和恢复建议
  - 空状态要有引导文案，不要只显示空白

  ## Impeccable 视觉反模式（严禁，发现即打回）

  ### 字体反模式
  - **禁止 Inter/Roboto 大面积用于正文**：Inter 和 Roboto 是几何无衬线体，中文环境下与中文字体（Noto Sans SC/PingFang SC）混排时 x-height 不匹配，导致中英文基线不齐。正文必须以系统中文无衬线为首选，Inter/Roboto 仅允许用于纯英文数字（如代码、数据表格数字列）
  - **禁止在同一个页面使用超过 2 种字族**：正文无衬线 + 等宽字体即可，禁止引入第三种装饰性字体
  - **禁止字重 black/900**：最粗只允许 semibold(600)/bold(700)
  - **禁止全大写英文段落**：英文标题使用 sentence case（首字母大写），不要 ALL CAPS

  ### 色彩反模式
  - **禁止紫蓝渐变**（`linear-gradient(135deg, #667eea, #764ba2)` 这类 indigo-purple 渐变是模板网站烂大街效果，严禁使用）
  - **禁止多彩渐变按钮/卡片**：按钮只能用纯色（品牌色或白色+边框）
  - **禁止玻璃拟态**（glassmorphism：`backdrop-filter: blur` + 半透明背景）
  - **禁止霓虹/荧光色**：除了状态色（成功/警告/错误/信息），所有颜色饱和度不得超过品牌色 `#335c8e`
  - **禁止糖果色用于大面积背景**：糖果色只用于角色头像 badge（面积 < 5%）
  - **禁止深色底上的浅色低对比度文字**：正文对比度必须满足 WCAG AA（4.5:1 以上）

  ### 布局反模式
  - **禁止卡片套卡片**：一个卡片容器内不允许再嵌套带边框/阴影的子卡片。信息分组使用分割线或背景色差（`#fafafa` vs `#ffffff`），不要层层包裹
  - **禁止过度圆角**：卡片圆角上限 8px，按钮 6px，禁止 16px+ 的大圆角（pills 除外，仅限 badge/tag）
  - **禁止浮动操作按钮（FAB）遮挡内容**：右下角悬浮按钮必须留出足够的安全距离，且不超过 1 个
  - **禁止无意义的装饰元素**：不承载信息的几何图形、波浪线、点阵背景、3D 插画一律禁止
  - **禁止双滚动条**：页面内嵌套滚动区域必须有明确的视觉边界，且主滚动条只在页面级别
  - **禁止无限宽内容区**：正文内容区最大宽度 1200px，超宽屏两侧留白居中，避免行长超过 80 字符导致阅读困难

  ### 动效规格（正向规格 + 工程红线；token 定义于 frontend/src/app.css @theme）
  > 本节替代旧版"动效反模式"：审美类禁令改写为正向 token 规格（AI 对正向规格的执行质量远高于对禁令的规避），
  > 性能类条款保留为工程红线。目标是"优雅克制但充满活力"：不冲突、不唐突、不过分。
  - **缓动曲线全局只允许两条**：
    - 标准 `--ease-standard: cubic-bezier(0.16,1,0.3,1)`：hover、面板开合、内容切换
    - 软着陆 `--ease-soft: cubic-bezier(0.34,1.3,0.64,1)`（约 5% 过冲，即克制的"缓慢弹跳"）：仅用于悬浮面板开合与徽标状态变化，禁止滥用
  - **时长只允许三档**（任何 transition/animation 必须取其一，禁止档外自定义值）：
    - `--duration-hover: 120ms`：hover/按下反馈
    - `--duration-panel: 200ms`：悬浮面板开合、内容切换、实时新消息入场
    - `--duration-page: 400ms`：仅页面级转场
  - **工程红线·只允许 transform 与 opacity 参与动画**：禁止动画布局属性（width/height/top/left/margin），避免重排抖动
  - **工程红线·禁止无限循环动画**：加载 spinner 与打字机光标是仅有的例外
  - **入场动画**：批量列表/卡片/模态框直接呈现，不要 fadeIn/slideIn（避免等待感）；唯一例外是实时到达的单条新消息，允许 `--duration-panel` 的 opacity + ≤4px 上移
  - **禁止 hover 时改变布局**：hover 效果只允许颜色/透明度/阴影变化，不得导致元素位移或尺寸变化
  - **必须尊重 prefers-reduced-motion**：用户偏好减少动画时，所有过渡/动画降级为即时呈现

  ### 悬浮画布体系（FloatingPanel 基元 + 徽标轨；实现见 frontend/src/components/ui/floating-panel.tsx 与 meeting/canvas-rail.tsx、canvas-layer.tsx）
  - **两档档位**：M = `--panel-width-m`（448px）右贴边默认档（洞察：冲突与证据/相关会议/可观测）；L = `--panel-width-l`（720px）居中偏右沉浸档（操作回放、报告全文）。用户仅可升档（M→L，升档记忆持久化），不可降档或自由缩放
  - **非模态**：不设遮罩层，画布打开时对话流仍可操作（边看边聊）；层级取 `--z-panel`
  - **单焦点**：同一时刻最多一个画布展开（状态源 ui-slice.activeCanvas）；打开新画布即替换旧画布（旧画布走 200ms 退场动画）
  - **入口为徽标轨**：对话流右侧垂直小徽标列，悬停显示功能名（title），点击打开画布，再次点击收起；数据类徽标可带数量角标（如冲突计数）
  - **关闭方式**：ESC / 标题栏关闭按钮 / 被其他画布替换
  - **档内最多一条主滚动条**：画布内容容器为唯一滚动区（允许 sticky tab 栏）；回放等多窗格工具视图允许各窗格局部滚动
  - **窄屏兜底**：画布最大宽度 = 100vw - 2rem

  ### 表单反馈规范（FieldError/FormAlert 基元；实现见 frontend/src/components/ui/form-feedback.tsx）
  - **范式统一**：带字段校验的表单统一用 react-hook-form；校验时机为提交时校验 + 出错后变更即时重校验（reValidateMode: onChange），禁止输入中即时报错制造打扰
  - **字段级错误只允许 FieldError**：紧贴字段下方，`text-xs text-danger` + `role="alert"`；出错字段同时设 `aria-invalid`（自动红框，Input/Textarea 内置）与 `aria-describedby` 关联错误文本
  - **表单级错误只允许 FormAlert 横幅**：仅承载无法归属单一字段的服务端/网络错误（如"用户名或密码错误"），置于字段与提交按钮之间
  - **禁止用 toast 承载字段校验错误**：toast 只用于操作结果反馈（创建成功/失败等）；校验错误必须留在字段旁，用户视线无需跳转
  - **禁止静默 return**：任何校验失败必须有可见反馈；触发型交互（输入框 + 触发按钮）以 disabled 为主反馈，键盘路径（Enter）补 FieldError

  ### 间距反模式
  - **禁止 padding/margin 使用非 4px 基准值**：所有间距必须是 4 的倍数（4/8/12/16/20/24/32/48/64），禁止 5px/7px/10px/13px 这类非基准值
  - **禁止卡片内容贴边**：卡片内边距至少 16px
  - **禁止元素间距小于 4px**：最小间距单位 4px
