# Conclave evaluation framework configuration
# 评估框架配置：被测系统、评分器、执行、统计、服务连接
# 当前策略：火山方舟 V4-Pro 作为被测模型（500K 免费额度），V4-Pro 同时作为 Judge
# 被测系统和 Judge 共用 V4-Pro，确保评测不受模型能力差异干扰

# 被测系统（System Under Test）配置
target:
  llm_model: "deepseek-v4-pro-260425"
  base_url: "http://localhost:8000"
  embedding_model: "bge-m3"
  reranker_model: "bge-reranker-v2-m3"

# LLM-as-Judge 评分器配置
# Judge 使用火山方舟 V4-Pro（与被测系统同模型，消除模型差异干扰）
# judge 通过 /chat/completions 端点直接调用 LLM，不经过后端代理
judge:
  model: "deepseek-v4-pro-260425"
  base_url: "https://ark.cn-beijing.volces.com/api/v3"
  api_key_env: "VOLCENGINE_API_KEY"      # 从该环境变量读取 API key
  judge_runs: 1                           # 基线测试用 1 次
  unreliable_threshold: 0.2              # 标准差超过该值则标记 unreliable

# 执行配置
execution:
  pass_k: 1                              # 基线测试用 1 次（后续可增至 3 次计算 Pass@k）
  max_concurrent: 2                     # 最大并发用例数（降低以避免速率限制）
  per_case_timeout: 600                 # 单用例超时（秒），V4-Pro 推理需要更长时间
  retry_on_timeout: true                # 超时后是否重试

# 统计配置
stats:
  confidence_level: 0.95               # 置信区间置信水平
  regression_pass1_threshold: 0.05     # Pass@1 下降超过该值判定为回归
  regression_score_threshold: 0.1      # 阶段通过率/平均分下降超过该值判定为回归

# 被测服务连接配置
service:
  base_url: "http://localhost:8000"
  frontend_url: "http://localhost:5173"
  admin_username: "admin"
  admin_password: "admin123"
