# nginx.preview.conf - 前端预览专用配置（独立容器运行，无后端）
server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index app.html;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    server_tokens off;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API/WS 端点：预览模式下返回 503（后端未启动）
    location ~ ^/(api|meetings|workspace|health|agent-roles|preferences|llm|auth|metrics|audit|debug|captcha|config|documents|net-auth|docker-hosts|regression|ws)(/.*)?$ {
        return 503 '{"error":"backend not available in preview mode"}';
        add_header Content-Type application/json;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /app.html;
    }
}
