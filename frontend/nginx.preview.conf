# nginx.preview.conf - 前端预览专用配置（独立容器运行，无后端）
server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index app.html;

    server_tokens off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

    proxy_hide_header Server;
    proxy_hide_header X-Powered-By;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API/WS 端点：预览模式下返回 503（后端未启动），不暴露具体技术栈
    location ~ ^/(api|meetings|workspace|health|agent-roles|preferences|llm|auth|metrics|audit|debug|captcha|config|documents|net-auth|docker-hosts|regression|ws|docs|redoc|openapi\.json)(/.*)?$ {
        return 503 '{"status":"unavailable"}';
        add_header Content-Type application/json;
    }

    # 隐藏敏感文件
    location ~ /\.(ht|git|env|svn|DS_Store) {
        deny all;
        return 404;
        access_log off;
        log_not_found off;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /app.html;
    }
}
