# ===== Conclave 前端 nginx 配置（指纹隐藏加固版）=====
# 安全原则：最小暴露原则，所有外部流量经 nginx 统一出入
# - server_tokens off 隐藏 nginx 版本号
# - proxy_hide_header 剥离后端框架头（uvicorn/starlette/FastAPI）
# - /docs /openapi.json /redoc 限制内网访问
# - VNC 端点限制内网访问
# - 隐藏 .git/.env/.ht 等敏感文件
# - 自定义错误页避免默认 nginx 4xx/5xx 页面特征
# - CSP/X-Robots-Tag/Permissions-Policy 等安全头

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index app.html;

    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    client_max_body_size 20m;

    # === 指纹隐藏 ===
    server_tokens off;

    # === 安全响应头 ===
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss:; frame-ancestors 'self'; base-uri 'self'; form-action 'self';" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet, noodp, noimageindex" always;

    # === gzip 压缩 ===
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # === 默认代理设置（所有 proxy location 继承）===
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header Server;
    proxy_hide_header X-Powered-By;
    proxy_hide_header Via;

    # === 自定义错误页：重定向到首页，不暴露 nginx 默认错误页 ===
    error_page 400 401 402 403 404 /error_redirect;
    error_page 500 501 502 503 504 /error_redirect;

    location = /error_redirect {
        internal;
        default_type text/html;
        return 200 '<!DOCTYPE html><html><head><meta charset="utf-8"><title></title></head><body><script>location.href="/"</script></body></html>';
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # === 健康检查：对外仅返回最简状态，内网可看详情 ===
    location = /health {
        set $health_detail "0";
        if ($remote_addr ~* "^(127\.|10\.|172\.(1[6-9]|2[0-9]|3[01])\.|192\.168\.)") {
            set $health_detail "1";
        }
        proxy_pass http://backend:8000/health?detail=$health_detail;
    }

    # === FastAPI 文档：仅内网可见 ===
    location ~ ^/(docs|redoc|openapi\.json) {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://backend:8000;
    }

    # === 静态资源缓存 ===
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /app.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # ============ SPA exact routes ============
    location = / { try_files /app.html =404; }
    location = /admin { try_files /app.html =404; }
    location = /operations { try_files /app.html =404; }
    location = /settings { try_files /app.html =404; }
    location = /board { try_files /app.html =404; }
    location = /explore { try_files /app.html =404; }
    location = /graph { try_files /app.html =404; }
    location = /reports { try_files /app.html =404; }
    location = /agents { try_files /app.html =404; }
    location = /workspace { try_files /app.html =404; }
    location = /projects { try_files /app.html =404; }
    location = /login { try_files /app.html =404; }
    location = /landing { try_files /app.html =404; }
    location = /setup {
        if ($request_method = POST) {
            proxy_pass http://backend:8000;
        }
        try_files /app.html =404;
    }
    location = /admin/ { try_files /app.html =404; }
    location = /operations/ { try_files /app.html =404; }
    location = /settings/ { try_files /app.html =404; }
    location = /board/ { try_files /app.html =404; }
    location = /explore/ { try_files /app.html =404; }
    location = /graph/ { try_files /app.html =404; }
    location = /reports/ { try_files /app.html =404; }
    location = /agents/ { try_files /app.html =404; }
    location = /workspace/ { try_files /app.html =404; }
    location = /projects/ { try_files /app.html =404; }
    location = /login/ { try_files /app.html =404; }
    location = /landing/ { try_files /app.html =404; }
    location = /setup/ {
        try_files /app.html =404;
    }

    # ============ API proxy ============
    # 注意：projects/issues 不在此列——裸路径 /projects 是前端 SPA 路由，
    # 项目/议题 API 已挂 /api 前缀（/api/projects、/api/issues，由 api 分支覆盖）。
    location ~ ^/(api|setup|workspace|agent-roles|preferences|llm|auth|audit|captcha|config|documents|net-auth|docker-hosts|regression|system|notifications|tenants|meetings|admin|graph|agents|artifacts)(/.*)?$ {
        proxy_pass http://backend:8000;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # ============ Internal-only: debug/metrics ============
    location ^~ /debug {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://backend:8000;
    }
    location ^~ /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://backend:8000;
    }

    # ============ VNC（值守模式）：仅内网可见，指向后端容器内 noVNC ============
    location /vnc.html {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://backend:6080;
    }
    location /vnc {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://backend:6080;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location /websockify {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://backend:6080;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }

    # ============ 隐藏敏感文件/目录 ============
    location ~ /\.(ht|git|env|svn|DS_Store|hg|bzr) {
        deny all;
        return 404;
        access_log off;
        log_not_found off;
    }

    location ~ ~$|\.(bak|old|swp|swo|orig|save|sql|log)$ {
        deny all;
        return 404;
        access_log off;
        log_not_found off;
    }

    # ============ WebSocket ============
    location /ws {
        proxy_pass http://backend:8000;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }

    # ============ SPA fallback ============
    location / {
        try_files $uri $uri/ /app.html;
    }
}
