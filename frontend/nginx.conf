server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index app.html;

    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    client_max_body_size 20m;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    server_tokens off;

    # Default proxy settings (inherited by all proxy locations)
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /app.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
    }

    # ============ SPA exact routes ============
    location = / { try_files /app.html =404; }
    location = /admin { try_files /app.html =404; }
    location = /operations { try_files /app.html =404; }
    location = /settings { try_files /app.html =404; }
    location = /board { try_files /app.html =404; }
    location = /explore { try_files /app.html =404; }
    location = /graph { try_files /app.html =404; }
    location = /reports { try_files /app.html =404; }
    location = /agents { try_files /app.html =404; }
    location = /workspace { try_files /app.html =404; }
    location = /login { try_files /app.html =404; }
    location = /landing { try_files /app.html =404; }
    location = /setup {
        if ($request_method = POST) {
            proxy_pass http://backend:8000;
        }
        try_files /app.html =404;
    }
    location = /admin/ { try_files /app.html =404; }
    location = /operations/ { try_files /app.html =404; }
    location = /settings/ { try_files /app.html =404; }
    location = /board/ { try_files /app.html =404; }
    location = /explore/ { try_files /app.html =404; }
    location = /graph/ { try_files /app.html =404; }
    location = /reports/ { try_files /app.html =404; }
    location = /agents/ { try_files /app.html =404; }
    location = /workspace/ { try_files /app.html =404; }
    location = /login/ { try_files /app.html =404; }
    location = /landing/ { try_files /app.html =404; }
    location = /setup/ {
        try_files /app.html =404;
    }

    # ============ API proxy ============
    location ~ ^/(api|setup|workspace|health|agent-roles|preferences|llm|auth|audit|debug|captcha|config|documents|net-auth|docker-hosts|regression|notifications|tenants|metrics|meetings|admin|graph|agents)(/.*)?$ {
        proxy_pass http://backend:8000;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # WebSocket
    location /ws {
        proxy_pass http://backend:8000;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }

    # Internal-only
    location ^~ /debug {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://backend:8000;
    }
    location ^~ /metrics {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
        proxy_pass http://backend:8000;
    }

    # VNC
    location /vnc.html {
        set $vnc_upstream "http://vnc:6080";
        proxy_pass $vnc_upstream;
    }
    location /vnc {
        set $vnc_upstream "http://vnc:6080";
        proxy_pass $vnc_upstream;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
    location /websockify {
        set $vnc_upstream "http://vnc:6080";
        proxy_pass $vnc_upstream;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /app.html;
    }
}
