# docker-compose.frontend-dev.yml
# 前端开发专用覆盖：在容器内运行 Vite dev server（热更新/HMR），不依赖后端服务
# 使用方法: docker compose -f docker-compose.yml -f docker-compose.frontend-dev.yml up -d frontend-dev
# 访问: http://localhost:5173/

services:
  frontend-dev:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: conclave-dev-frontend-dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - ./frontend/index.html:/app/index.html
      - ./frontend/app.html:/app/app.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tailwind.config.ts:/app/tailwind.config.ts
      - ./frontend/postcss.config.js:/app/postcss.config.js
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8000
      - VITE_WS_URL=ws://localhost:8000
      - CHOKIDAR_USEPOLLING=true
    restart: unless-stopped
    networks:
      - conclave-internal

networks:
  conclave-internal:
    name: conclave-dev_conclave-internal
